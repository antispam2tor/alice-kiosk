  <text x="103" y="45" fill="#18332f" font-family="Arial" font-weight="700" font-size="23">Alice</text>
  <circle cx="1036" cy="36" r="5" fill="#4aa979"/><text x="1051" y="41" fill="#6e7975" font-family="Arial" font-size="13">Downtown Office</text>
  <text x="600" y="162" text-anchor="middle" fill="#a1762e" font-family="Arial" font-weight="700" font-size="11" letter-spacing="2">WELCOME TO HARTWELL &amp; COLE</text>
