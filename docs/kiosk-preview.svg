    <rect x="437" y="318" width="326" height="138" rx="17" fill="#fff" stroke="#deded7"/><rect x="462" y="357" width="56" height="56" rx="14" fill="#f5ead7"/><text x="539" y="374" fill="#18332f" font-weight="700" font-size="17">New client inquiry</text><text x="539" y="400" fill="#7a8581" font-size="13">Tell us how we can help</text>
    <rect x="790" y="318" width="326" height="138" rx="17" fill="#fff" stroke="#deded7"/><rect x="815" y="357" width="56" height="56" rx="14" fill="#e9eef2"/><text x="892" y="374" fill="#18332f" font-weight="700" font-size="17">Delivery or vendor</text><text x="892" y="400" fill="#7a8581" font-size="13">Notify a team member</text>
