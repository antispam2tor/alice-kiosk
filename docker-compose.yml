services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alice
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes:
      - alice_pg:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alice -d alice"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: 8787
      APP_ORIGIN: http://localhost:8787
      DATABASE_URL: postgres://alice:local-development-only@postgres:5432/alice
      JWT_SECRET: local-development-secret-change-me-00000000
      ADMIN_TOKEN: alice-demo-admin
    ports: ["8787:8787"]
volumes:
  alice_pg:
